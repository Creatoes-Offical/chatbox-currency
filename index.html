<!DOCTYPE html>
<html>
<head>
<title>CHATBOX CURRENCY</title>
<style>
body {
  font-family: Arial;
  max-width: 600px;
  margin: 80px auto;
}
input {
  font-size: 24px;
  padding: 10px;
  width: 150px;
}
.result {
  font-size: 28px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>CHATBOX CURRENCY</h1>
<p>The unbelievable currency</p>

<input id="amount" type="number" value="1">

<span> Unbelievable Currency</span>

<div class="result" id="result">5 OwO Cash</div>

<script>
const amount = document.getElementById("amount")
const result = document.getElementById("result")

amount.addEventListener("input", () => {
  result.textContent = (amount.value * 5) + " OwO Cash"
})
</script>

</body>
</html>
